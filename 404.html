<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>404 — Страница не найдена</title>
    <meta name="theme-color" content="#202020">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        @font-face {
            font-family: 'Handjet Circle Double';
            font-weight: 100 900;
            font-display: swap;
            src: url('/static/HandjetCircleDouble.woff2') format('woff2');
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #202020;
            color: #EBEBEB;
            font-family: 'Handjet Circle Double', 'Segoe UI', system-ui;
            font-variation-settings: 'ELGR' 2, 'ELSH' 8;
            padding: 48px 32px;
            text-align: center;
        }

        ::selection {
            background: rgba(120, 157, 42, .4);
        }

        h1 {
            font-weight: 800;
            font-size: 120px;
            line-height: 1;
            letter-spacing: 2px;
            color: #EF9282;
            margin: 0;
        }

        .message {
            font-weight: 600;
            font-size: 28px;
            margin-top: 16px;
            color: #AAA;
        }

        .home-link {
            display: inline-block;
            margin-top: 32px;
            padding: 12px 32px;
            border-radius: 14px;
            background: #252525;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
            color: #EBEBEB;
            font-family: 'Handjet Circle Double', 'Segoe UI', system-ui;
            font-weight: 600;
            font-size: 22px;
            text-decoration: none;
            transition: all 180ms cubic-bezier(.2, .7, .2, 1);
        }

        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.08);
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p class="message">Страница не найдена</p>
    <a class="home-link" href="/">← На главную</a>
</body>
</html>
