<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>MULTIVARKA</title>
    <meta name="description" content="Themultivarka socials">
    <meta name="keywords" content="multivarka, themultivarka, mvrk">
    <meta name="author" content="Themultivarka">
    <meta name="theme-color" content="#050409">

    <meta property="og:title" content="MULTIVARKA">
    <meta property="og:description" content="projects and social media links.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MULTIVARKA">
    <meta property="og:locale" content="ru_RU">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MULTIVARKA">
    <meta name="twitter:description" content="projects and social media links.">

    <link rel="icon" href="static/favicon.png" type="image/png">
    <link rel="preload" href="static/HandjetCircleDouble.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        @font-face {
            font-family: 'Handjet Circle Double';
            font-weight: 100 900;
            font-display: swap;
            src: url('static/HandjetCircleDouble.woff2') format('woff2');
        }

        :root {
            --bg: #050409;
            --ink: #e9e6f5;
            --mute: #8d88a8;
            --violet: #5b2eff;
            --violet-soft: rgba(91, 46, 255, .35);
            --line: rgba(255, 255, 255, .09);
            --ease: cubic-bezier(.2, .7, .2, 1);
            --mx: 50%;
            --my: 42%;
        }

        * { box-sizing: border-box }

        html, body { height: 100% }

        body {
            margin: 0;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: calc(48px + env(safe-area-inset-top)) 24px calc(48px + env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--ink);
            font-family: 'Handjet Circle Double', 'Segoe UI', system-ui, sans-serif;
            font-variation-settings: 'ELGR' 2, 'ELSH' 8;
            text-align: center;
            overflow-x: hidden;
        }

        ::selection { background: var(--violet-soft) }

        :focus-visible { outline: 2px solid #9b82ff; outline-offset: 3px }

        .sr-only {
            position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
            overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }

        /* ---------- фон ---------- */
        .glow {
            position: fixed; inset: 0; z-index: -2; pointer-events: none;
            background:
                radial-gradient(520px circle at var(--mx) var(--my), rgba(91, 46, 255, .22), transparent 70%),
                radial-gradient(900px circle at 50% 110%, rgba(91, 46, 255, .12), transparent 70%);
            animation: fade 1.6s var(--ease) both;
        }

        .grain {
            position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .05;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        /* уголки как на лого */
        .corner {
            position: fixed; width: 64px; height: 64px; z-index: 0; pointer-events: none;
            border: 0 solid var(--line);
            animation: fade 1.2s .9s var(--ease) both;
        }
        .corner::after {
            content: ''; position: absolute; width: 10px; height: 10px; background: var(--violet);
        }
        .c-tl { top: 28px; left: 28px; border-top-width: 1px; border-left-width: 1px }
        .c-tl::after { top: 8px; left: 8px }
        .c-tr { top: 28px; right: 28px; border-top-width: 1px; border-right-width: 1px }
        .c-tr::after { top: 8px; right: 8px }
        .c-bl { bottom: 28px; left: 28px; border-bottom-width: 1px; border-left-width: 1px }
        .c-bl::after { bottom: 8px; left: 8px }
        .c-br { bottom: 28px; right: 28px; border-bottom-width: 1px; border-right-width: 1px }
        .c-br::after { bottom: 8px; right: 8px }

        .px {
            position: fixed; z-index: 0; pointer-events: none; background: var(--violet);
            opacity: 0; animation: px-float var(--d, 9s) var(--delay, 0s) ease-in-out infinite;
        }

        /* ---------- сцена ---------- */
        .stage {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            width: min(100%, 560px);
        }

        .plus-wrap {
            width: clamp(150px, 34vw, 230px);
            perspective: 900px;
            animation: drop 1.1s .1s var(--ease) both;
        }

        .plus {
            display: block; width: 100%; height: auto;
            mix-blend-mode: lighten;
            transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
            transition: transform .25s var(--ease);
            filter: drop-shadow(0 0 40px rgba(91, 46, 255, .35));
            animation: bob 6s 1.4s ease-in-out infinite;
            user-select: none; -webkit-user-drag: none;
        }

        .word {
            display: block; width: clamp(240px, 56vw, 380px); height: auto; margin-top: 18px;
            mix-blend-mode: lighten;
            animation: wipe 1s .55s var(--ease) both;
            user-select: none; -webkit-user-drag: none;
        }

        .meta {
            margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 12px;
            animation: rise .8s 1.05s var(--ease) both;
        }
        .meta span { font-weight: 600; font-size: 24px }
        .name { color: #b7a6ff }
        .age { color: var(--mute) }
        .dot { width: 5px; height: 5px; border-radius: 50%; background: #4b4666 }

        .spoiler {
            display: inline-block; padding: 2px 8px; border-radius: 5px; cursor: pointer;
            background: #2a2640; color: transparent; user-select: none; border: 0;
            font: inherit; position: relative; overflow: hidden;
            transition: color .25s, background .25s;
        }
        .spoiler::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(100deg, transparent 30%, rgba(155, 130, 255, .35) 50%, transparent 70%);
            transform: translateX(-100%); animation: shimmer 3.2s 2s infinite;
        }
        .spoiler.revealed { color: var(--ink); background: rgba(255, 255, 255, .08) }
        .spoiler.revealed::after { display: none }

        .socials {
            margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
        }
        .socials a {
            --c: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            width: 54px; height: 54px; border-radius: 14px;
            background: rgba(255, 255, 255, .035);
            box-shadow: inset 0 0 0 1px var(--line);
            color: var(--ink); font-size: 24px; text-decoration: none;
            backdrop-filter: blur(6px);
            opacity: 0; animation: rise .7s var(--ease) forwards;
            animation-delay: calc(1.25s + var(--i) * 70ms);
            transition: transform 220ms var(--ease), color 180ms, background 180ms, box-shadow 180ms;
        }
        .socials a:hover, .socials a:focus-visible {
            transform: translateY(-4px) scale(1.06);
            color: var(--c);
            background: color-mix(in srgb, var(--c) 16%, transparent);
            box-shadow: inset 0 0 0 1px var(--c), 0 10px 30px -8px color-mix(in srgb, var(--c) 55%, transparent);
        }
        .socials a:active { transform: translateY(-1px) scale(.97) }
        .twitch { --c: #9146ff }
        .telegram { --c: #2ca5e0 }
        .youtube { --c: #ff2b2b }
        .steam { --c: #66c0f4 }
        .github { --c: #ffffff }

        /* ---------- анимации ---------- */
        @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
        @keyframes drop {
            from { opacity: 0; transform: translateY(-40px) scale(.8); filter: blur(14px) }
            to { opacity: 1; transform: none; filter: none }
        }
        @keyframes wipe {
            from { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(-12px) }
            to { opacity: 1; clip-path: inset(0 0 0 0); transform: none }
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(14px) }
            to { opacity: 1; transform: none }
        }
        @keyframes bob {
            0%, 100% { translate: 0 0 }
            50% { translate: 0 -8px }
        }
        @keyframes shimmer { 60%, 100% { transform: translateX(100%) } }
        @keyframes px-float {
            0% { opacity: 0; transform: translateY(0) }
            20% { opacity: .9 }
            80% { opacity: .5 }
            100% { opacity: 0; transform: translateY(-46px) }
        }

        @media (max-width: 520px) {
            .corner { width: 40px; height: 40px }
            .c-tl, .c-tr { top: 16px } .c-bl, .c-br { bottom: 16px }
            .c-tl, .c-bl { left: 16px } .c-tr, .c-br { right: 16px }
            .meta span { font-size: 21px }
            .socials a { width: 50px; height: 50px }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important; animation-delay: 0s !important;
                animation-iteration-count: 1 !important; transition-duration: .01ms !important;
            }
            .px { display: none }
        }
    </style>
</head>

<body>
    <div class="glow" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <i class="corner c-tl" aria-hidden="true"></i>
    <i class="corner c-tr" aria-hidden="true"></i>
    <i class="corner c-bl" aria-hidden="true"></i>
    <i class="corner c-br" aria-hidden="true"></i>
    <div id="pixels" aria-hidden="true"></div>

    <main class="stage">
        <h1 class="sr-only">MULTIVARKA</h1>

        <div class="plus-wrap" id="plusWrap">
            <img class="plus" id="plus" src="static/logo-plus.png" alt="" width="450" height="420" decoding="async" fetchpriority="high">
        </div>
        <img class="word" src="static/logo-word.png" alt="MVRK" width="920" height="210" decoding="async">

        <div class="meta">
            <span class="name">Themultivarka</span>
            <span class="dot"></span>
            <span class="age">
                <button class="spoiler" type="button" aria-label="Показать возраст">67</button> лет
            </span>
        </div>

        <nav class="socials" aria-label="Соцсети">
            <a class="twitch" style="--i:0" href="https://twitch.tv/themultivarka" target="_blank" rel="noopener" title="Twitch" aria-label="Twitch"><i class="fab fa-twitch"></i></a>
            <a class="telegram" style="--i:1" href="https://t.me/multicooker" target="_blank" rel="noopener" title="Telegram" aria-label="Telegram"><i class="fab fa-telegram"></i></a>
            <a class="youtube" style="--i:2" href="https://youtube.com/@themultivarka" target="_blank" rel="noopener" title="YouTube" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
            <a class="steam" style="--i:3" href="https://steamcommunity.com/profiles/76561199707898172/" target="_blank" rel="noopener" title="Steam" aria-label="Steam"><i class="fab fa-steam"></i></a>
            <a class="github" style="--i:4" href="https://github.com/multivarka01" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub"><i class="fab fa-github"></i></a>
        </nav>
    </main>

    <script>
        (function () {
            var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            var root = document.documentElement;

            // спойлер возраста
            var sp = document.querySelector('.spoiler');
            sp.addEventListener('click', function () {
                sp.classList.toggle('revealed');
                sp.setAttribute('aria-label', sp.classList.contains('revealed') ? 'Скрыть возраст' : 'Показать возраст');
            });

            // пиксели-искры как на лого
            var box = document.getElementById('pixels');
            if (!reduce) {
                for (var i = 0; i < 14; i++) {
                    var p = document.createElement('i');
                    var s = 6 + Math.round(Math.random() * 8);
                    p.className = 'px';
                    p.style.cssText =
                        'width:' + s + 'px;height:' + s + 'px;' +
                        'left:' + (6 + Math.random() * 88) + '%;top:' + (8 + Math.random() * 84) + '%;' +
                        '--d:' + (7 + Math.random() * 7).toFixed(1) + 's;' +
                        '--delay:' + (1.5 + Math.random() * 8).toFixed(1) + 's;' +
                        (Math.random() > .6 ? 'background:#2a2640;' : '');
                    box.appendChild(p);
                }
            }

            if (reduce) return;

            // свечение за курсором + наклон плюса
            var plus = document.getElementById('plus');
            var wrap = document.getElementById('plusWrap');
            var raf = 0, tx = 0, ty = 0, px = 0, py = 0;

            function frame() {
                raf = 0;
                root.style.setProperty('--mx', px + 'px');
                root.style.setProperty('--my', py + 'px');
                plus.style.setProperty('--rx', tx + 'deg');
                plus.style.setProperty('--ry', ty + 'deg');
            }

            addEventListener('pointermove', function (e) {
                px = e.clientX; py = e.clientY;
                var r = wrap.getBoundingClientRect();
                var dx = (e.clientX - (r.left + r.width / 2)) / innerWidth;
                var dy = (e.clientY - (r.top + r.height / 2)) / innerHeight;
                ty = Math.max(-1, Math.min(1, dx * 2)) * 22;
                tx = Math.max(-1, Math.min(1, dy * 2)) * -18;
                if (!raf) raf = requestAnimationFrame(frame);
            }, { passive: true });

            document.addEventListener('pointerleave', function () {
                tx = ty = 0;
                if (!raf) raf = requestAnimationFrame(frame);
            });
        })();
    </script>
</body>
</html>
