<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MULTIVARKA</title>
    <meta name="description" content="Themultivarka socials">
    <meta name="keywords" content="multivarka, themultivarka">
    <meta name="author" content="Themultivarka">
    <meta name="theme-color" content="#202020">

    <meta property="og:title" content="MULTIVARKA">
    <meta property="og:description" content="projects and social media links.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MULTIVARKA">
    <meta property="og:locale" content="ru_RU">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MULTIVARKA">
    <meta name="twitter:description" content="projects and social media links.">

    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        @font-face {
            font-family: 'Handjet Circle Double';
            font-weight: 100 900;
            font-display: swap;
            src: url('/static/HandjetCircleDouble.woff2') format('woff2');
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #202020;
            color: #EBEBEB;
            font-family: 'Handjet Circle Double', 'Segoe UI', system-ui;
            font-variation-settings: 'ELGR' 2, 'ELSH' 8;
            padding: 48px 32px;
            text-align: center
        }

        ::selection {
            background: rgba(120, 157, 42, .4)
        }

        h1 {
            margin: 0;
            font-weight: 800;
            font-size: 84px;
            line-height: .88;
            letter-spacing: 1px;
            color: #fff
        }

        .meta {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px
        }

        .meta span {
            font-weight: 600;
            font-size: 22px
        }

        .name {
            color: #EF9282
        }

        .age {
            color: #AAA
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #696969
        }

        .spoiler {
            display: inline-block;
            background: #444;
            color: #444;      
            padding: 2px 8px;
            border-radius: 5px;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s, background 0.2s;
        }
        .spoiler.revealed {
            color: inherit;      
            background: rgba(255,255,255,0.08);
        }

        .socials {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px
        }

        .socials a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: #252525;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .1);
            color: #EBEBEB;
            font-size: 24px;
            text-decoration: none;
            transition: all 180ms cubic-bezier(.2, .7, .2, 1)
        }

        .socials a:hover {
            transform: translateY(-2px)
        }

        .twitch:hover {
            color: #9146FF;
            box-shadow: inset 0 0 0 1px #9146FF;
            background: rgba(145, 70, 255, .18)
        }

        .telegram:hover {
            color: #2CA5E0;
            box-shadow: inset 0 0 0 1px #26A5E4;
            background: rgba(38, 165, 228, .18)
        }

        .youtube:hover {
            color: #F00;
            box-shadow: inset 0 0 0 1px #F00;
            background: rgba(255, 0, 0, .16)
        }

        .steam:hover {
            color: #66C0F4;
            box-shadow: inset 0 0 0 1px #66C0F4;
            background: rgba(102, 192, 244, .18)
        }

        .github:hover {
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .55);
            background: rgba(255, 255, 255, .1)
        }
    </style>
</head>

<body>
    <h1>MULTIVARKA</h1>
    <div class="meta">
        <span class="name">Themultivarka</span>
        <span class="dot"></span>
        <span class="age">
            <span class="spoiler" onclick="this.classList.toggle('revealed')">67</span> лет
        </span>
    </div>

    <div class="socials">
        <a class="twitch" href="https://twitch.tv/themultivarka" target="_blank" rel="noopener" title="Twitch"><i class="fab fa-twitch"></i></a>
        <a class="telegram" href="https://t.me/multicooker" target="_blank" rel="noopener" title="Telegram"><i class="fab fa-telegram"></i></a>
        <a class="youtube" href="https://youtube.com/@themultivarka" target="_blank" rel="noopener" title="YouTube"><i class="fab fa-youtube"></i></a>
        <a class="steam" href="https://steamcommunity.com/profiles/76561199707898172/" target="_blank" rel="noopener" title="Steam"><i class="fab fa-steam"></i></a>
        <a class="github" href="https://github.com/multivarka01" target="_blank" rel="noopener" title="GitHub"><i class="fab fa-github"></i></a>
    </div>
</body>
</html>
